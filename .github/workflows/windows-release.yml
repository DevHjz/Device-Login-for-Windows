name: Build Windows Installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify public-client source and Native SSO protocol
        run: |
          pnpm run check
          pnpm run build
          pnpm run verify:native-sso
          pnpm run verify:windows-shell
          pnpm run verify:device-security
          node scripts/verify-public-client.cjs
          node scripts/verify-release-config.cjs

      - name: Build installer
        run: pnpm run dist:win:${{ matrix.arch }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.arch }}
          path: release/cloud-verify-device-auth-*-win-${{ matrix.arch }}-setup.exe
          if-no-files-found: error
          retention-days: 14

  bundle:
    name: Create dual-architecture installer bundle
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download x64 installer
        uses: actions/download-artifact@v4
        with:
          name: installer-x64
          path: installers

      - name: Download ARM64 installer
        uses: actions/download-artifact@v4
        with:
          name: installer-arm64
          path: installers

      - name: Create release archive with two installers
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path installers -Filter '*.exe'
          if ($files.Count -ne 2) { throw "Expected exactly two installer files, found $($files.Count)." }
          Compress-Archive -Path $files.FullName -DestinationPath cloud-verify-device-auth-windows-x64-arm64.zip -Force

      - name: Upload combined release archive
        uses: actions/upload-artifact@v4
        with:
          name: cloud-verify-device-auth-windows-x64-arm64
          path: cloud-verify-device-auth-windows-x64-arm64.zip
          if-no-files-found: error
          retention-days: 30
