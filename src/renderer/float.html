<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'" />
    <title>云端验证设备认证状态</title>
    <link rel="stylesheet" href="float.css" />
  </head>
  <body>
    <main class="float-card">
      <header class="float-header">
        <div><p>设备态势</p><h1>云端验证设备认证状态</h1></div>
        <span id="float-risk" class="risk risk-neutral" title="正在读取本机安全状态">检查中</span>
      </header>
      <section class="float-details" aria-live="polite">
        <div><span>登录用户</span><strong id="float-user" title="未登录">—</strong></div>
        <div><span>所属租户</span><strong id="float-tenant" title="未选择租户">—</strong></div>
        <div><span>租户网域</span><strong id="float-domain" title="未获取">—</strong></div>
        <div><span>IP 地址</span><strong id="float-ip" title="正在检测">—</strong></div>
        <div class="security-row"><span>安全认证</span><strong id="float-security" title="正在检测">检查中</strong></div>
      </section>
      <div class="float-actions">
        <button id="float-login" type="button">登录</button>
        <button id="float-refresh" class="secondary" type="button">刷新</button>
      </div>
    </main>
    <script src="float.js"></script>
  </body>
</html>
