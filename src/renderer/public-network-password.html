<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>解除公网访问限制</title>
  <link rel="stylesheet" href="public-network-password.css" />
</head>
<body>
  <main class="password-dialog" aria-labelledby="password-title">
    <button id="close-password-dialog" class="close-button" type="button" aria-label="关闭密码输入窗" title="关闭">×</button>
    <h1 id="password-title">解除公网访问限制</h1>
    <p>请输入管理员密码以授权当前公网访问。</p>
    <form id="password-form">
      <label for="password">管理员密码</label>
      <input id="password" type="password" autocomplete="current-password" required autofocus />
      <p id="password-message" class="message" role="alert"></p>
      <button type="submit">确认</button>
    </form>
  </main>
  <script src="public-network-password.js"></script>
</body>
</html>
